services:
  keylife-import:
    build: .
    container_name: keylife-import
    restart: unless-stopped
    ports:
      - "8123:8080"
    volumes:
      - ./data:/data
    environment:
      WPAI_BASE_URL: "https://www.keylife.org/wp-load.php"
      WPAI_IMPORT_KEY: "${WPAI_IMPORT_KEY}"
      WPAI_IMPORT_ID: "13"
      SITE_LABEL: "Key Life Import"

      # Shared secret for the status page. Blank = no check.
      ACCESS_TOKEN: "${ACCESS_TOKEN}"

      # Schedule
      PROCESSING_INTERVAL_SECONDS: "120"    # 2 minutes
      TRIGGER_INTERVAL_SECONDS: "14400"     # 4 hours
      TRIGGER_ON_START: "false"
      SCHEDULER_ENABLED: "true"

      HTTP_TIMEOUT: "120"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 60s
      timeout: 10s
      retries: 3
