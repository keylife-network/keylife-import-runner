services:
  keylife-import:
    build: .
    container_name: keylife-import
    restart: unless-stopped
    ports:
      - "8123:8080"
    environment:
      WPAI_BASE_URL: "https://www.keylife.org/wp-load.php"
      WPAI_IMPORT_KEY: "${WPAI_IMPORT_KEY}"
      WPAI_IMPORT_ID: "13"
      SITE_LABEL: "Key Life Import"

      # Shared secret. Blank = anyone who can reach the page can run it.
      ACCESS_TOKEN: "${ACCESS_TOKEN}"

      # Pacing / safety limits
      TRIGGER_PAUSE_SECONDS: "3"
      POLL_SECONDS: "5"
      MAX_ATTEMPTS: "240"
      MAX_SECONDS: "1800"
      STABLE_REPEATS: "3"
      HTTP_TIMEOUT: "120"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 60s
      timeout: 10s
      retries: 3
